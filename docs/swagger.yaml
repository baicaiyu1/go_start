basePath: /
definitions:
  system.FileData:
    properties:
      filepath:
        type: string
    type: object
  system.FileResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/system.FileData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  system.MessageData:
    properties:
      message:
        type: string
    type: object
  system.MessageResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/system.MessageData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  upload.BatchData:
    properties:
      names:
        items:
          type: string
        type: array
    type: object
  upload.BatchResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/upload.BatchData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  upload.ErrorResp:
    properties:
      code:
        type: integer
      message:
        type: string
      trace_id:
        type: string
    type: object
  upload.UploadData:
    properties:
      name:
        type: string
      size:
        type: integer
    type: object
  upload.UploadResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/upload.UploadData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  user.CreateUserReq:
    properties:
      age:
        description: 年龄：用 *int 指针，才能区分“没传”和“传了 0”；必填且范围 0~130
        maximum: 130
        minimum: 0
        type: integer
      email:
        description: 邮箱：必填，且必须是合法邮箱
        type: string
      name:
        description: 用户名：json 字段名是 name；必填；长度 2~20
        maxLength: 20
        minLength: 2
        type: string
      role:
        description: |-
          角色：缺省时由 handler 填 user；只能是 admin 或 user
          go-playground 不支持 default 标签，所以这里用 omitempty 允许空值
        enum:
        - admin
        - user
        type: string
      tags:
        description: 标签：最多 5 个；dive 表示继续校验每个元素；每个元素至少 1 个字符
        items:
          type: string
        maxItems: 5
        type: array
    required:
    - age
    - email
    - name
    type: object
  user.CreateUserResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/user.CreateUserReq'
      message:
        type: string
      trace_id:
        type: string
    type: object
  user.MessageData:
    properties:
      message:
        type: string
    type: object
  user.MessageResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/user.MessageData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  user.UserData:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  user.UserResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/user.UserData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  user.ValidateErrorResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/user.ValidationErrorData'
      message:
        type: string
      trace_id:
        type: string
    type: object
  user.ValidationErrorData:
    properties:
      detail:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: 参数绑定与校验示例：用户、健康检查、文件路由。
  title: Hertz 教程示例 API
  version: "1.0"
paths:
  /api/v1/files/{filepath}:
    get:
      parameters:
      - description: 文件路径
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.FileResp'
      summary: 回显文件路径
      tags:
      - 基础设施
  /api/v1/upload/batch:
    post:
      consumes:
      - multipart/form-data
      description: form-data 字段 files；一次 1-5 个文件，单文件 ≤5MB，扩展名走白名单校验
      parameters:
      - description: 文件（1-5 个）
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/upload.BatchResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/upload.ErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/upload.ErrorResp'
      summary: 批量上传文件
      tags:
      - 上传
  /api/v1/upload/one:
    post:
      consumes:
      - multipart/form-data
      description: form-data 字段 file；单文件 ≤5MB，扩展名走白名单校验，落盘到 ./uploads
      parameters:
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/upload.UploadResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/upload.ErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/upload.ErrorResp'
      summary: 上传单个文件
      tags:
      - 上传
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: 校验请求体后回显用户信息；role 缺省为 user
      parameters:
      - description: 用户信息
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.CreateUserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ValidateErrorResp'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/user.ValidateErrorResp'
      summary: 创建用户
      tags:
      - 用户
  /api/v1/users/{id}:
    get:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.MessageResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.MessageResp'
      summary: 按 ID 查询用户
      tags:
      - 用户
  /api/v1/users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.MessageResp'
      summary: 查询当前用户
      tags:
      - 用户
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.MessageResp'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/system.MessageResp'
      summary: 健康检查
      tags:
      - 基础设施
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.MessageResp'
      summary: 连通性探测
      tags:
      - 基础设施
schemes:
- http
swagger: "2.0"
